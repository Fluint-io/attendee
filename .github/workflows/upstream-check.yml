name: Upstream check
run-name: Upstream check${{ inputs.since && ' (backfill)' || '' }}

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill: report from this UTC time (e.g. 2026-11-09T00:00:00Z). No Slack; does not move the baseline.'
        required: false
      sync_ref:
        description: 'Upstream ref for the Codex sync PR: main (default), a tag, or pull/<n>/head for an open upstream PR.'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: upstream-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare with upstream Attendee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: .github/scripts/check-upstream.sh

  # Merges upstream into a branch and lets Codex decide if it is worth a PR and resolve conflicts.
  # This job holds no write token: Codex can change any file here, including this script.
  sync:
    if: ${{ !inputs.since }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.package.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the meeting service (read-only, for the import check)
        uses: actions/checkout@v4
        with:
          repository: Fluint-io/meeting
          path: .sync-overlay/meeting
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false
      - name: Start the upstream merge
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_REF: ${{ inputs.sync_ref }}
        run: .github/scripts/upstream-sync.sh prepare
      - name: Codex reviews the merge
        if: steps.prep.outputs.run == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/upstream-sync-prompt.md
          output-schema-file: .github/codex/upstream-sync-schema.json
          output-file: ${{ runner.temp }}/upstream-sync/decision.json
          sandbox: workspace-write
      - name: Commit the result as a bundle
        id: package
        if: steps.prep.outputs.run == 'true'
        env:
          SYNC_REF: ${{ inputs.sync_ref }}
        run: .github/scripts/upstream-sync.sh package
      - if: steps.package.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/upstream-sync/
          retention-days: 7

  # Runs the script from a fresh checkout of main, checks the bundle, then pushes and opens the PR.
  # A person reviews and merges; deploys stay manual.
  publish:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/upstream-sync
      - name: Open the sync PR
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_REF: ${{ inputs.sync_ref }}
        run: .github/scripts/upstream-sync.sh publish
